# The registry of the collection: the repositories, as a tree, and the versions they all share.
#
# The root, lean4-phylogenetics, holds the library that every repository shares. Each hub holds the
# library of what its papers share, and the catalog of its papers (catalog/papers.toml in the hub).
# A paper's repository is listed in its hub's catalog; it is listed here too only when it needs a
# note (it is off the train, or has generic module roots). A definition or result goes to the lowest
# node above every repository that uses it (docs/CONVENTIONS.md, Section 4).
#
# scripts/status.py renders the README's tables from this file and compares it with the
# repositories on disk; scripts/new_paper.py reads [train].

# The release that every repository is on, and the commit of each library of the tree that the
# repositories below it require. Move the train deliberately, root first (docs/WORKFLOW.md, Section 7).
[train]
lean = "leanprover/lean4:v4.36.0-rc1"
mathlib = "v4.36.0-rc1"

[train.pins]
Phylogenetics = "8c66a1354fc32f0e59ee22634916b154eebb54ee"     # lean4-phylogenetics 0.4.0
TreeOfBlobs = "289439fa2a79279ca6cc9f3b1e39496602d93db1"       # lean4-tob 0.2.0
PhyloNetwork = "2c40af02ee813cf5ac8b6b7eafc0510172041bc0"      # lean4-phylo-network 0.1.0

# role: root | hub | paper | background (a formalized paper outside every catalog) | tool
# parent: the hub or root above it
# require: whether new repositories may require it: "always", "when-needed", or "no" (see `note`)

[[repo]]
name = "lean4-phylogenetics"
role = "root"
package = "Phylogenetics"
url = "https://github.com/vltanh/lean4-phylogenetics"
lean = "v4.36.0-rc1"
require = "always"
title = "Phylogenetics"
summary = "What every repository shares: rooted networks (cuts, blobs, induced networks, the tree of blobs, level-1 networks), trees and quartets, neighbor joining and ASTRAL's dynamic program, Kingman's coalescent, the multispecies coalescent and the network multispecies coalescent with quartet concordance factors"

[[repo]]
name = "lean4-tob"
role = "hub"
parent = "lean4-phylogenetics"
package = "TreeOfBlobs"
url = "https://github.com/vltanh/lean4-tob"
lean = "v4.36.0-rc1"
require = "when-needed"
title = "The tree of blobs"
summary = "What the papers on inferring the tree of blobs share: hypothesis tests on quartet concordance factors, blobs of level-1 networks, networks given by tables, and the sources several papers cite (Mitchell et al. 2019, Rhodes 2020, Huber et al. 2025)"

[[repo]]
name = "lean4-phylo-network"
role = "hub"
parent = "lean4-phylogenetics"
package = "PhyloNetwork"
url = "https://github.com/vltanh/lean4-phylo-network"
lean = "v4.36.0-rc1"
require = "always"
title = "Phylogenetic network estimation"
summary = "What the papers on estimating whole networks share: nothing yet. Its catalog has the papers on quartet- and quintet-based inference, semi-directed and rooted reconstruction, multiple trees, and sequence data"

[[repo]]
name = "lean4-camus"
role = "paper"
parent = "lean4-phylo-network"
package = "Camus"
url = "https://github.com/vltanh/lean4-camus"
lean = "v4.35.0-rc4"
require = "no"
summary = "Willson, Warnow 2026 (CAMUS), with Observation 2 and the site model of Warnow, Tabatabaee, Evans 2025"
note = "Off the train (Lean v4.35.0-rc4); requires lean4-adr11 rather than lean4-phylogenetics, and has top-level Challenge and Solution modules"

[[repo]]
name = "lean4-adr11"
role = "background"
parent = "lean4-phylogenetics"
package = "ADR11"
url = "https://github.com/vltanh/lean4-adr11"
lean = "v4.35.0-rc3"
require = "no"
summary = "Allman, Degnan, Rhodes 2011: the rooted species tree from unrooted gene trees under the coalescent; its general parts are in lean4-phylogenetics"
note = "Off the train (Lean v4.35.0-rc3); use lean4-phylogenetics instead"

[[repo]]
name = "lean4-gusfield2007"
role = "background"
parent = "lean4-phylogenetics"
package = "Gusfield2007"
url = "https://github.com/vltanh/lean4-gusfield2007"
lean = "v4.36.0-rc1"
require = "when-needed"
summary = "Gusfield, Bansal, Bafna, Song 2007: the decomposition theory of networks with recombination"
note = "Requires lean4-phylogenetics 0.3.1 (f1a3592), from before the train moved to 0.4.0; its modules use the generic roots External and MainResults, which no other repository may use"

[[repo]]
name = "formalize-math-paper"
role = "tool"
url = "https://github.com/vltanh/formalize-math-paper"
require = "no"
summary = "The procedure that formalizes each paper"
